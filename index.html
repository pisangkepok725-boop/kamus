<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff3d86">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kamus Serba Indonesia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f5fb;--surface:#fff;--ink:#1c1b2e;--mute:#6a6880;--line:#e3e1ee;--acc:#ff3d86;--acc-ink:#fff;--hl:#ffe14d;
--c-Gaul:#ff3d86;--c-Now:#7a4dff;--c-Lama:#b8741a;--c-Partikel:#0f9d8a;--c-Baku:#2f6fed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141f;--surface:#1e1d2b;--ink:#f2f1fa;--mute:#a09fb6;--line:#33314a;--hl:#6b5d00;
--c-Gaul:#ff6fa3;--c-Now:#a58bff;--c-Lama:#e0a050;--c-Partikel:#3fd3bf;--c-Baku:#6f9bff}}
:root[data-theme="dark"]{--bg:#15141f;--surface:#1e1d2b;--ink:#f2f1fa;--mute:#a09fb6;--line:#33314a;--hl:#6b5d00;
--c-Gaul:#ff6fa3;--c-Now:#a58bff;--c-Lama:#e0a050;--c-Partikel:#3fd3bf;--c-Baku:#6f9bff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;font-weight:800;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;margin:0 0 8px;letter-spacing:-.02em}
h1 mark{background:var(--hl);color:inherit;padding:0 .12em;border-radius:6px}
.sub{color:var(--mute);margin:0 0 22px;max-width:46ch}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px}
input[type=search]{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:14px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);outline:none}
input[type=search]:focus-visible{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:600;font-size:.9rem;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;color:var(--mute);font-size:.9rem}
.btn{font:inherit;font-weight:600;font-size:.9rem;border:0;background:var(--acc);color:var(--acc-ink);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:active{transform:scale(.97)}
.entry{padding:16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.w{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;font-weight:800;font-size:1.5rem;line-height:1.1}
.tag{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;color:var(--tc);border:1.5px solid var(--tc)}
.m{margin:6px 0 4px}
.e{margin:0;color:var(--mute);font-style:italic}
.flash{animation:fl .9s ease-out}
@keyframes fl{from{background:var(--hl)}to{background:transparent}}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
.today{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:16px 18px;margin:0 0 18px;box-shadow:6px 6px 0 var(--hl)}
.today .tl{font-size:.85rem;font-weight:600;color:var(--mute);margin-bottom:4px}
.today .w{font-size:2rem}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kamus <mark>Serba</mark> Indonesia</h1>
  <p class="sub">Dari “dong” sampai “syahdan”: bahasa gaul, jaman now, partikel obrolan, kata lama, dan bahasa baku dalam satu kamus.</p>
  <section class="today" id="today" aria-label="Kata hari ini"></section>
  <div class="search">
    <input id="q" type="search" placeholder="Cari kata atau arti… (mis. mager, dong)" autocomplete="off" aria-label="Cari kata">
    <div class="chips" id="chips" role="group" aria-label="Kategori"></div>
  </div>
  <div class="bar"><span id="count"></span><button class="btn" id="rnd">Kata acak</button></div>
  <div id="list"></div>
</div>
<script>
var RAW = `ayo|Partikel|Kata ajakan untuk melakukan sesuatu bersama.|“Ayo dong, jangan lama-lama!”
dong|Partikel|Penegas permintaan atau desakan yang terdengar akrab; juga berarti “masa tidak”.|“Bantuin dong, please.”
sih|Partikel|Penekan pertanyaan atau pernyataan, sering dengan nuansa heran atau protes.|“Kamu kenapa sih dari tadi diam?”
deh|Partikel|Penegas persetujuan, ajakan, atau pasrah.|“Ya udah deh, aku ikut.”
kok|Partikel|Menyatakan heran atau membantah sesuatu.|“Kok kamu belum pulang?”
kan|Partikel|Meminta konfirmasi dari lawan bicara; singkatan dari “bukan”.|“Kamu udah makan, kan?”
lho|Partikel|Seruan kaget atau heran. Bisa juga ditulis “loh”.|“Lho, ini kan punyaku!”
nih|Partikel|Penunjuk benda dekat atau penegas; bentuk santai dari “ini”.|“Nih, makan dulu.”
tuh|Partikel|Penunjuk benda yang agak jauh; bentuk santai dari “itu”.|“Tuh, orangnya datang.”
mah|Partikel|Penegas topik pembicaraan (pengaruh Sunda dan Betawi).|“Aku mah gampang, terserah kamu.”
atuh|Partikel|Padanan “dong” dalam bahasa Sunda yang sering terbawa ke obrolan.|“Jangan gitu atuh.”
yuk|Partikel|Ajakan yang lebih santai dari “ayo”.|“Yuk, berangkat sekarang.”
banget|Partikel|Sangat; penguat arti sifat.|“Enak banget, serius!”
doang|Partikel|Hanya; bentuk santai dari “saja”.|“Cuma nanya doang kok.”
aja|Partikel|Saja; bisa juga menyatakan ajakan.|“Kamu duluan aja.”
kali|Partikel|Mungkin, atau “bisa jadi”.|“Dia lagi sibuk kali.”
dah|Partikel|Bentuk singkat dari “sudah”, dipakai di akhir kalimat.|“Oke dah, beres.”
gabut|Gaul|Gaji buta; tidak punya kegiatan dan merasa bosan.|“Lagi gabut nih, ada rekomendasi film?”
mager|Gaul|Malas gerak; enggan beranjak dari tempat nyaman.|“Mager banget keluar, hujan pula.”
baper|Gaul|Bawa perasaan; terlalu terbawa emosi oleh hal kecil.|“Dia cuma bercanda, jangan baper.”
santuy|Gaul|Santai; plesetan dari “santai” yang dibuat lucu.|“Santuy aja, masih banyak waktu.”
gercep|Gaul|Gerak cepat; segera bertindak.|“Gercep ya, deadline-nya sore ini.”
kepo|Gaul|Ingin tahu urusan orang lain (dari knowing every particular object).|“Kepo deh, dia lagi sama siapa?”
bucin|Gaul|Budak cinta; rela melakukan apa saja demi pasangan.|“Dia bucin parah, tiap hari dianter-jemput.”
gaje|Gaul|Tidak jelas; singkatan dari “gak jelas”.|“Ceritanya gaje banget.”
lebay|Gaul|Berlebihan dalam bersikap atau bereaksi.|“Ah, lebay kamu, cuma lecet doang.”
receh|Gaul|Lelucon sederhana yang lucu karena ringan, atau orang yang mudah tertawa.|“Humornya receh tapi bikin ngakak.”
mantul|Gaul|Mantap betul; pujian untuk sesuatu yang bagus.|“Ide kamu mantul!”
sabi|Gaul|Bisa; dari pembalikan huruf “bisa”.|“Besok sabi ketemu?”
gokil|Gaul|Luar biasa, atau gila dalam arti seru dan kocak.|“Konsernya gokil abis!”
kuy|Gaul|Yuk; pembalikan huruf dari “yuk”.|“Makan kuy, laper nih.”
woles|Gaul|Santai; pembalikan huruf dari “selow”.|“Woles bro, nggak usah panik.”
jaim|Gaul|Jaga image; bersikap menjaga citra di depan orang.|“Di depan gebetan dia jaim banget.”
garing|Gaul|Lelucon yang tidak lucu atau suasana yang hambar.|“Jokes-nya garing, nggak ada yang ketawa.”
cupu|Gaul|Kuno, kurang gaul, atau culun.|“Jangan ngatain orang cupu dong.”
kece|Gaul|Keren dan menarik.|“Jaketmu kece banget.”
alay|Gaul|Berlebihan dan norak dalam gaya, terutama cara menulis atau bergaya.|“Tulisannya 4L4Y banget.”
bete|Gaul|Bad mood; kesal atau bosan.|“Lagi bete gara-gara macet.”
curhat|Gaul|Mencurahkan isi hati kepada orang lain.|“Boleh curhat nggak? Lagi pusing.”
nongkrong|Gaul|Duduk santai bersama teman di suatu tempat.|“Sore ini nongkrong di kafe yuk.”
gebetan|Gaul|Orang yang sedang disukai dan didekati.|“Itu gebetannya yang baru, ya?”
nyokap|Gaul|Ibu (dari bahasa Betawi).|“Nyokap lagi masak di dapur.”
bokap|Gaul|Ayah (dari bahasa Betawi).|“Bokap nitip salam buat kamu.”
gue|Gaul|Saya (Betawi/Jakarta); pasangannya “lo” atau “lu” untuk kamu.|“Gue nggak tau, tanya lo aja.”
ngegas|Gaul|Berbicara atau bereaksi dengan emosi tinggi.|“Santai dong, nggak usah ngegas.”
healing|Jaman Now|Liburan atau aktivitas untuk memulihkan diri dari penat.|“Weekend ini aku healing ke pantai.”
flexing|Jaman Now|Memamerkan harta atau pencapaian. Bentuk dasarnya “flex”.|“Kerjaannya flexing mobil mulu.”
spill|Jaman Now|Membocorkan atau menceritakan sesuatu (informasi, gosip).|“Spill dong, siapa orangnya?”
auto|Jaman Now|Otomatis; langsung jadi begitu.|“Dikasih gratisan, auto semangat.”
fomo|Jaman Now|Fear of missing out; takut ketinggalan tren atau momen.|“Beli karena FOMO, padahal nggak butuh.”
red flag|Jaman Now|Tanda bahaya pada sifat atau perilaku seseorang; lawannya “green flag”.|“Suka bohong itu red flag banget.”
ghosting|Jaman Now|Menghilang tanpa kabar secara tiba-tiba, terutama dalam hubungan.|“Dia ghosting setelah tiga kali kencan.”
gaslighting|Jaman Now|Manipulasi yang membuat orang meragukan ingatan atau kewarasannya sendiri.|“Dia malah bilang aku lebay, itu gaslighting.”
slay|Jaman Now|Pujian untuk penampilan atau penampilan yang memukau.|“Outfit hari ini slay banget!”
vibes|Jaman Now|Suasana atau aura yang dirasakan dari suatu tempat atau orang.|“Kafe ini vibes-nya cozy.”
relate|Jaman Now|Merasa sama atau cocok dengan pengalaman orang lain.|“Ceritamu relate banget sama aku.”
salting|Jaman Now|Salah tingkah karena malu atau gugup, biasanya di depan orang yang disuka.|“Dia salting pas disapa gebetannya.”
pansos|Jaman Now|Panjat sosial; mendekati orang terkenal demi ikut terkenal.|“Dia pansos ke selebgram itu.”
cringe|Jaman Now|Sesuatu yang membuat malu atau geli ketika melihatnya.|“Video lamaku cringe banget.”
sus|Jaman Now|Mencurigakan; dari kata “suspicious”.|“Gerak-geriknya sus deh.”
skena|Jaman Now|Lingkungan atau komunitas gaya hidup tertentu, misalnya musik indie.|“Anak skena biasanya hafal band lokal.”
gemoy|Jaman Now|Menggemaskan; dari “gemas”.|“Kucingnya gemoy banget.”
gaskeun|Jaman Now|Ayo lakukan sekarang; dari “gas” dan akhiran “-keun”.|“Udah siap? Gaskeun!”
nolep|Jaman Now|Tidak punya kehidupan sosial; “no life”, sering untuk yang sibuk main gim.|“Weekend dia nolep di kamar.”
mukbang|Jaman Now|Siaran makan dalam jumlah banyak (dari bahasa Korea).|“Nonton mukbang malem-malem bikin laper.”
roasting|Jaman Now|Mengkritik atau menyindir dengan lelucon.|“Teman-temannya roasting dia habis-habisan.”
ambyar|Jaman Now|Hancur hati; populer lewat lagu-lagu patah hati.|“Denger lagunya, hatiku ambyar.”
sepuh|Jaman Now|Orang yang paling senior dan berpengalaman dalam suatu bidang.|“Tanya aja ke sepuh komunitas ini.”
lekas|Lama|Cepat atau segera.|“Lekas sembuh, ya.”
nian|Lama|Sungguh atau sangat (juga dalam beberapa bahasa daerah).|“Indah nian pemandangan ini.”
jua|Lama|Juga.|“Ia pun pergi jua.”
tatkala|Lama|Ketika atau pada saat.|“Tatkala fajar menyingsing, ia berangkat.”
syahdan|Lama|Kata pembuka cerita lama: konon, alkisah, maka.|“Syahdan, hiduplah seorang raja yang adil.”
alkisah|Lama|Kata pembuka dongeng: dikisahkan bahwa.|“Alkisah, di sebuah negeri jauh…”
hatta|Lama|Kata penyambung cerita lama: maka, setelah itu.|“Hatta, beberapa hari kemudian tibalah mereka.”
beta|Lama|Saya (untuk raja atau di Maluku).|“Beta titahkan agar pesta dimulai.”
hamba|Lama|Saya yang merendah; juga berarti pelayan.|“Hamba mohon ampun, Tuanku.”
sahaya|Lama|Saya dengan sopan; juga berarti budak.|“Sahaya hanya menyampaikan pesan.”
tuanku|Lama|Sapaan hormat kepada raja atau orang yang dimuliakan.|“Apa titah Tuanku?”
gerangan|Lama|Kata tanya yang terasa bertanya-tanya: kiranya.|“Siapakah gerangan dia?”
kelak|Lama|Nanti di masa depan.|“Kelak kau akan mengerti.”
jelita|Lama|Cantik atau elok.|“Gadis jelita itu tersenyum.”
bahtera|Lama|Perahu besar atau kapal; sering dipakai kiasan rumah tangga.|“Bahtera rumah tangga mereka kokoh.”
dahulu kala|Lama|Zaman yang sangat lama berlalu.|“Dahulu kala, ada seekor kancil cerdik.”
tidak|Baku|Kata ingkar baku untuk kata kerja dan sifat; bentuk gaul: nggak, gak, ga.|“Saya tidak tahu.”
silakan|Baku|Persilaan yang benar; bukan “silahkan”.|“Silakan duduk.”
apotek|Baku|Tempat obat dijual; bukan “apotik”.|“Beli obat di apotek.”
izin|Baku|Persetujuan atau perkenan; bukan “ijin”.|“Saya minta izin pulang lebih awal.”
risiko|Baku|Akibat yang kurang menyenangkan; bukan “resiko”.|“Setiap pekerjaan ada risikonya.”
aktivitas|Baku|Kegiatan; bukan “aktifitas”.|“Aktivitas siswa dimulai pukul tujuh.”
sekadar|Baku|Hanya atau sebatas itu; ejaan yang benar, bukan “sekedar”.|“Itu sekadar saran.”
praktik|Baku|Pelaksanaan nyata; bukan “praktek”.|“Dokter itu membuka praktik.”`;
var CATS = ["Semua","Partikel","Gaul","Jaman Now","Lama","Baku"];
var KEY = {"Jaman Now":"Now"};
var D = RAW.trim().split("\n").map(function(l){var p=l.split("|");return {w:p[0],c:p[1],m:p[2],e:p[3]}})
  .sort(function(a,b){return a.w.localeCompare(b.w,"id")});
var cat = "Semua", q = "";
var list = document.getElementById("list"), count = document.getElementById("count"), chips = document.getElementById("chips");
function colorOf(c){return "var(--c-"+(KEY[c]||c)+")"}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function row(d,i){
  return '<article class="entry" id="e'+i+'"><div class="top"><span class="w">'+esc(d.w)+'</span><span class="tag" style="--tc:'+colorOf(d.c)+'">'+esc(d.c)+'</span></div><p class="m">'+esc(d.m)+'</p><p class="e">'+esc(d.e)+'</p></article>';
}
function render(){
  var t = q.trim().toLowerCase();
  var res = D.filter(function(d){
    if(cat!=="Semua" && d.c!==cat) return false;
    return !t || d.w.toLowerCase().indexOf(t)>-1 || d.m.toLowerCase().indexOf(t)>-1;
  });
  count.textContent = res.length + " kata";
  list.innerHTML = res.length ? res.map(row).join("") : '<div class="empty">Kata tidak ditemukan. Coba ejaan lain atau pilih kategori Semua.</div>';
}
function buildChips(){
  chips.innerHTML = CATS.map(function(c){return '<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+c+'">'+c+'</button>'}).join("");
}
chips.addEventListener("click",function(ev){
  var b = ev.target.closest(".chip"); if(!b) return;
  cat = b.getAttribute("data-c"); buildChips(); render();
});
document.getElementById("q").addEventListener("input",function(ev){q = ev.target.value; render()});
document.getElementById("rnd").addEventListener("click",function(){
  document.getElementById("q").value = ""; q = ""; cat = "Semua"; buildChips();
  var d = D[Math.floor(Math.random()*D.length)];
  list.innerHTML = row(d,0).replace('class="entry"','class="entry flash"');
  count.textContent = "Kata acak";
});
buildChips(); render();
var t0 = D[Math.floor(Date.now()/86400000) % D.length];
document.getElementById("today").innerHTML = '<div class="tl">Kata hari ini</div><div class="top"><span class="w">'+esc(t0.w)+'</span><span class="tag" style="--tc:'+colorOf(t0.c)+'">'+esc(t0.c)+'</span></div><p class="m">'+esc(t0.m)+'</p><p class="e">'+esc(t0.e)+'</p>';
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})}</script>
</body>
</html>
